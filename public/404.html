<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Namma Theatre Food</title>
    <script>
      // Single Page Application redirect handler for Firebase Hosting fallback
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        // Redirect to index.html while preserving query parameters (seat, screen, view)
        window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
      })();
    </script>
  </head>
  <body style="background:#09090b; color:#fbbf24; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <div style="text-align:center;">
      <h2>Loading Namma Theatre Food...</h2>
      <p style="color:#a1a1aa; font-size:14px;">Redirecting to your seat order...</p>
    </div>
  </body>
</html>
